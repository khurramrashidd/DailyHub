name: dailyhub
description: "DailyHub - All-in-one daily life manager (Trips, To-Dos, Notes, Reminders, Habits, Expenses & more)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (same project as your web app: khurram-world)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Fonts (Poppins — matches the original web app's design)
  google_fonts: ^6.2.1

  # Update checker (GitHub Releases API) — pure Dart, no native plugin
  http: ^1.2.2

  # Local notifications (reminders that fire when app is closed)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Storage & utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.1
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
